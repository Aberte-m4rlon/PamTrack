# Supabase Local & CLI Configuration for Pamasahe Tracker – Oriental Mindoro
project_id = "pamasahe-tracker-oriental-mindoro"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/reset-password"]
jwt_expiry = 3600
enable_signup = true

[functions.verify-fare-report]
verify_jwt = true

[functions.compute-route-osrm]
verify_jwt = false
